[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native airflow network and transient simulation workbench"

[[bin]]
name = "airframe"
path = "src/main.rs"

[dependencies]
airflow = { path = "../airflow" }
uuid.workspace = true
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde.workspace = true
serde_json.workspace = true

[target."cfg(windows)".dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
